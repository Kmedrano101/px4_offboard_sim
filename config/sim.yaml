# PX4 Offboard Sim: Simulation environment configuration
# Edit this file to change sim parameters without touching the launch file.
# This is the single source of truth for the entire simulation stack.

# ── PX4 SITL ─────────────────────────────────────────────
px4:
  autopilot_dir: "~/PX4-Autopilot"
  sim_model: "gz_x500_depth"
  gz_no_follow: true

# ── Drone Start Position ─────────────────────────────────
# PX4_GZ_MODEL_POSE format: x,y,z,roll,pitch,yaw (meters, radians)
# yaw=0 means facing +X direction
drone_start:
  x: 0.0
  y: 0.0
  z: 0.5
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

# ── MicroXRCE-DDS Agent ──────────────────────────────────
dds_agent:
  binary: "~/Micro-XRCE-DDS-Agent/build/MicroXRCEAgent"
  transport: "udp4"
  port: 8888

# ── ROS Middleware ────────────────────────────────────────
rmw_implementation: "rmw_fastrtps_cpp"

# ── TF Frames ────────────────────────────────────────────
# Static TF tree: map -> base_link -> {lidar_link, camera_link}
# Sensor offsets match the Gazebo SDF model (x500_depth)
frames:
  map_frame_id: "map"
  base_frame_id: "base_link"
  lidar_frame_id: "lidar_link"
  camera_frame_id: "camera_link"
  # Sensor poses relative to base_link (from model.sdf)
  lidar_offset: [0.0, 0.0, 0.052, 0.0, 0.0, 0.0]       # x, y, z, roll, pitch, yaw
  camera_offset: [0.12, 0.03, 0.242, 0.0, 0.0, 0.0]     # OakD-Lite mount position

# ── World ─────────────────────────────────────────────────
# Available: baylands, baylands_custom (with test walls), default
world: "baylands_custom"

# ── Gazebo-ROS Bridge ────────────────────────────────────
# Sensor topic mappings from Gazebo to ROS2.
# gz_topic_name uses world-scoped absolute paths:
#   /world/{world}/model/{model_instance}/link/{link}/sensor/{sensor}/{topic}
# The {world} and {model_instance} placeholders are resolved at launch time
# from the 'world' and 'px4.sim_model' fields above.
# model_instance is derived as: sim_model (without gz_ prefix) + "_0"
bridge:
  sensors:
    # OakD-Lite RGB camera (sensor: IMX214 on camera_link)
    - name: "RGB Camera"
      gz_topic: "/world/{world}/model/{model}/link/camera_link/sensor/IMX214/image"
      ros_topic: "/px4_offboard_sim/camera/image"
      ros_type: "sensor_msgs/msg/Image"
      gz_type: "gz.msgs.Image"
      queue: 5

    - name: "Camera Info"
      gz_topic: "/world/{world}/model/{model}/link/camera_link/sensor/IMX214/camera_info"
      ros_topic: "/px4_offboard_sim/camera/camera_info"
      ros_type: "sensor_msgs/msg/CameraInfo"
      gz_type: "gz.msgs.CameraInfo"
      queue: 5

    # OakD-Lite depth camera (sensor: StereoOV7251 on camera_link)
    # Uses <topic>depth_camera</topic> in SDF, so Gazebo publishes to
    # top-level /depth_camera (NOT world-scoped like other sensors).
    - name: "Depth Camera"
      gz_topic: "/depth_camera"
      ros_topic: "/px4_offboard_sim/depth_camera/depth_image"
      ros_type: "sensor_msgs/msg/Image"
      gz_type: "gz.msgs.Image"
      queue: 5

    - name: "Depth PointCloud"
      gz_topic: "/depth_camera/points"
      ros_topic: "/px4_offboard_sim/depth_camera/points"
      ros_type: "sensor_msgs/msg/PointCloud2"
      gz_type: "gz.msgs.PointCloudPacked"
      queue: 5

    # 3D GPU LiDAR (sensor: lidar on lidar_link)
    - name: "LiDAR PointCloud"
      gz_topic: "/world/{world}/model/{model}/link/lidar_link/sensor/lidar/scan/points"
      ros_topic: "/px4_offboard_sim/lidar/points"
      ros_type: "sensor_msgs/msg/PointCloud2"
      gz_type: "gz.msgs.PointCloudPacked"
      queue: 5

    - name: "LiDAR Scan"
      gz_topic: "/world/{world}/model/{model}/link/lidar_link/sensor/lidar/scan"
      ros_topic: "/px4_offboard_sim/lidar/scan"
      ros_type: "sensor_msgs/msg/LaserScan"
      gz_type: "gz.msgs.LaserScan"
      queue: 5

    # PX4 internal IMU (sensor: imu_sensor on base_link from x500_base)
    - name: "IMU"
      gz_topic: "/world/{world}/model/{model}/link/base_link/sensor/imu_sensor/imu"
      ros_topic: "/px4_offboard_sim/imu/data"
      ros_type: "sensor_msgs/msg/Imu"
      gz_type: "gz.msgs.IMU"
      queue: 10

  # Clock bridge (not model-scoped)
  clock:
    ros_type: "rosgraph_msgs/msg/Clock"
    gz_type: "gz.msgs.Clock"
    queue: 10

# ── Joy Control ──────────────────────────────────────────
# Controller presets: tpro (Jumper T-Pro V2), gamepad (PS4/Xbox)
joy:
  controller: "tpro"
  device: "/dev/input/js0"   # Jumper T-Pro V2 (override preset default of js1)

# ── Offboard Control ─────────────────────────────────────
# Config file for offboard control parameters (relative to config/)
offboard:
  config: "offboard_control.yaml"
