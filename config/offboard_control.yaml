# PX4 Offboard velocity control configuration
# All parameters are configurable via this file or CLI overrides.

/**:
  ros__parameters:
    # ── Flight Parameters ────────────────────────────────────
    takeoff_altitude: 3.0         # meters above ground (positive = up; NED = -3.0)
    landing_descent_speed: 0.5    # m/s vertical descent during landing
    position_switch_delay: 0.5    # seconds of no velocity input before switching to position hold
    velocity_threshold: 0.02      # magnitude threshold for detecting active velocity input
    min_safe_altitude: 1.5        # meters — minimum altitude enforced on position hold switch

    # ── PX4 Interface ────────────────────────────────────────
    streaming_threshold: 50       # setpoints to stream before arming (at 50Hz = 1 second)
    control_rate: 50.0            # Hz — main loop rate (must be > 2Hz for PX4 offboard)
    landing_timeout: 30.0         # seconds — maximum landing time before forced disarm

    # ── Topics ───────────────────────────────────────────────
    # PX4 v1.17 topic names (adjust if using a different PX4 version)
    topics:
      vehicle_status: "/fmu/out/vehicle_status_v1"
      vehicle_attitude: "/fmu/out/vehicle_attitude"
      vehicle_local_position: "/fmu/out/vehicle_local_position_v1"
      offboard_control_mode: "/fmu/in/offboard_control_mode"
      trajectory_setpoint: "/fmu/in/trajectory_setpoint"
      vehicle_command: "/fmu/in/vehicle_command"
      cmd_vel: "/px4_offboard_sim/offboard_control/cmd_vel"
      arm: "/px4_offboard_sim/offboard_control/arm"
